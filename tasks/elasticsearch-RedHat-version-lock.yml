---
- name: RedHat - install yum-version-lock
  become: yes
  yum:
    name: yum-plugin-versionlock
    state: present
    update_cache: yes

- name: RedHat - check if requested elasticsearch version lock exists
  become: yes
  shell: 'yum versionlock list | grep {{ es_package_name }} | grep -F -c "{{ es_version }}"'
  register: es_requested_version_locked
  failed_when: False
  changed_when: False
  check_mode: False

- name: RedHat - unlock stale elasticsearch version
  become: yes
  shell: "yum versionlock delete '0:{{ es_package_name }}*' || yum versionlock delete '{{ es_package_name }}*' || true"
  changed_when: true
  when:
    - es_version_lock | bool
    - es_requested_version_locked is defined
    - es_requested_version_locked.get('stdout', '0') | int == 0

- name: RedHat - lock elasticsearch version
  become: yes
  ansible.builtin.command:
    argv:
      - yum
      - versionlock
      - add
      - "{{ es_package_name }}-{{ es_version }}"
  changed_when: true
  when:
    - es_version_lock | bool
    - es_requested_version_locked is defined
    - es_requested_version_locked.get('stdout', '0') | int == 0

- name: RedHat - check if any elasticsearch version lock exists
  become: yes
  shell: yum versionlock list | grep -c elasticsearch
  register: es_version_locked
  failed_when: False
  changed_when: False
  check_mode: False

- name: RedHat - unlock elasticsearch version
  become: yes
  shell: yum versionlock delete 0:elasticsearch*
  when:
    - not es_version_lock
    - es_version_locked is defined
    - es_version_locked.get('stdout', '0') | int > 0
