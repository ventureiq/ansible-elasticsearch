---
# Manage Elasticsearch plugins

- name: Set fact es_plugins_reinstall
  ansible.builtin.set_fact:
    es_plugins_reinstall: >-
      {{ (debian_elasticsearch_install_from_repo is defined and debian_elasticsearch_install_from_repo.changed) or
         (redhat_elasticsearch_install_from_repo is defined and redhat_elasticsearch_install_from_repo.changed) or
         (elasticsearch_install_from_package is defined and elasticsearch_install_from_package.changed) or
         (es_plugins is not defined or es_plugins is none) }}

- name: Set list_command (exclude x-pack when not reinstalling)
  ansible.builtin.set_fact:
    list_command: "{{ '| grep -vE ''x-pack''' if not es_plugins_reinstall else '' }}"

- name: Remove x-pack plugin directory if not managed as plugin
  ansible.builtin.file:
    path: "{{ es_home }}/plugins/x-pack"
    state: absent

- name: Check installed elasticsearch plugins
  become: yes
  ansible.builtin.shell:
    cmd: "ls {{ es_home }}/plugins {{ list_command }}"
  register: installed_plugins
  changed_when: false
  ignore_errors: true
  environment:
    CONF_DIR: "{{ es_conf_dir }}"
    ES_PATH_CONF: "{{ es_conf_dir }}"
    ES_INCLUDE: "{{ default_file }}"
  check_mode: false

# Set plugins to remove
- name: Set plugins_to_remove (reinstall = remove all)
  ansible.builtin.set_fact:
    plugins_to_remove: "{{ installed_plugins.stdout_lines | default([]) }}"
  when: es_plugins_reinstall

- name: Set plugins_to_remove (normal = remove only unwanted)
  ansible.builtin.set_fact:
    plugins_to_remove: "{{ installed_plugins.stdout_lines | difference(es_plugins | json_query('[*].plugin')) | default([]) }}"
  when: not es_plugins_reinstall

# Set plugins to install
- name: Set plugins_to_install (reinstall = install all)
  ansible.builtin.set_fact:
    plugins_to_install: "{{ es_plugins | json_query('[*].plugin') | default([]) }}"
  when: es_plugins_reinstall

- name: Set plugins_to_install (normal = install missing only)
  ansible.builtin.set_fact:
    plugins_to_install: "{{ es_plugins | json_query('[*].plugin') | difference(installed_plugins.stdout_lines | default([])) | default([]) }}"
  when: not es_plugins_reinstall

# Remove plugins
- name: Remove elasticsearch plugins
  become: yes
  ansible.builtin.command:
    cmd: "{{ es_home }}/bin/elasticsearch-plugin remove {{ item }} --silent"
  loop: "{{ plugins_to_remove | default([]) }}"
  notify: restart elasticsearch
  environment:
    CONF_DIR: "{{ es_conf_dir }}"
    ES_PATH_CONF: "{{ es_conf_dir }}"
    ES_INCLUDE: "{{ default_file }}"

# Install plugins
- name: Install elasticsearch plugins
  become: yes
  ansible.builtin.command:
    cmd: "{{ es_home }}/bin/elasticsearch-plugin install {{ item.url | default(item.plugin) }} --batch --silent"
  loop: "{{ es_plugins }}"
  when: item.plugin in plugins_to_install
  register: plugin_installed
  changed_when: plugin_installed.rc | default(0) == 0
  until: plugin_installed.rc | default(0) == 0
  retries: 5
  delay: 5
  notify: restart elasticsearch
  environment:
    CONF_DIR: "{{ es_conf_dir }}"
    ES_PATH_CONF: "{{ es_conf_dir }}"
    ES_INCLUDE: "{{ default_file }}"
